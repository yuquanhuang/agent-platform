task_id: AP-E3-002
title: Message 历史、分支顺序和权限
status: completed
baseline: agent-platform-v1-dev-baseline-2026-08-r7
scope:
  includes:
    - 实现冻结 listSessionMessages 和 MessagePage，不修改公共契约
    - 新增不可变 chat_message 表、父消息链、Session Cursor 约束、索引和 FORCE RLS
    - 默认从 Session 当前 cursor_message_id 回溯完整消息链，显式 branch_id 查询指定历史分支
    - 使用固定 Tip 的不透明 Cursor 分页，保证追加新消息时既有翻页视图不漂移
    - Message 查询同时要求 Session 所有权、session:read 和 message:list 权限
    - 新增 Vue Session 消息历史页，安全展示内容分片、分支筛选和分页
    - 完成真实 PostgreSQL 分支顺序、不可变性、租户/用户隔离和全链路验证
  excludes:
    - 新增 Message 写入公共 API、聊天输入、编辑历史 Message 或物理删除消息
    - AgentRun/RunAttempt、创建 Run、Session 并发 Guard、Temporal Run Workflow 和 SSE
    - Artifact/Tool/Run 外键在对应事实表尚不存在时创建占位表
decisions:
  - Message 内容和父链均不可更新或删除，由数据库触发器保护
  - parent_message_id 是分支顺序权威来源，不以 created_at 或随机 UUID 推断顺序
  - 默认查询使用 Session cursor_message_id；显式 branch_id 使用该分支没有同分支子节点的 Tip
  - 分支查询回溯父链时包含继承自其他分支或主链的祖先消息
  - DELETED Session 不再返回 Message 正文；ACTIVE 和 ARCHIVED Session 可读
compatibility:
  - R7 listSessionMessages、Message 和 MessagePage 保持不变，生成 Client/DTO 无需更新
  - chat_session.cursor_message_id 增加同租户同 Session 复合外键；现有空 Cursor 数据兼容
  - AP-E3-003 必须复用 chat_message 不可变模型，并在 Run 创建事务中推进 Session Cursor
