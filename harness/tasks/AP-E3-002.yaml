acceptance:
  - 主链和历史分支均按父消息链稳定返回，分页不会重复、缺失或因新消息追加漂移
  - 跨租户、跨用户、无权限和 DELETED Session 均不得读取 Message 正文
  - Message UPDATE/DELETE、跨 Session Parent 和非法内容结构被应用或数据库拒绝
  - Vue 只读展示 text/reference/error 分片，不使用未消毒 HTML，不提前实现聊天和 Run
follow_up:
