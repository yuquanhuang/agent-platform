  migration_added: 0012_release_bundle
acceptance:
  - 同一 Idempotency-Key 重放同一 Release，且 Outbox 重投不会启动第二个 Workflow
  - Release 状态只能按冻结状态机 CAS 前进，失败同步终结 Operation
  - Bundle 身份和 object_uri 幂等，签名/SBOM/扫描缺失时不能进入成功状态
  - 激活前失败不修改 Agent active_deployment_id，也不创建伪造 Deployment
follow_up:
  - AP-E2-004 实现 Deployment STAGED/ACTIVE/RETIRED、fencing 和原子激活 Adapter
  - 外部 CI 回填 AgentScope Registry manifest digest 后配置生产 Runtime Target
  - 生产对象存储、签名/SBOM、扫描和 Sandbox Smoke Adapter 由部署环境显式注入；未配置时继续失败关闭
