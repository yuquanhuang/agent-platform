  - Event/SSE/Outbox/Reconciliation/Queue/Capacity 的失败和延迟已有低基数输入；持久积压、队列深度和容量饱和 Gauge 尚未完成，保留为后续项
  - Trace/Log 能使用 trace_id 关联跨组件流程，Metric 不使用高基数业务标识
  - 生产告警规则均有 severity、owner、for、恢复条件和存在的 Runbook 路径
  - 未运行的 AP-E7-005 负载、耐久和资源池隔离测试不记为通过
