task_id: AP-E7-004
title: SLO、指标、告警和 Trace 关联
status: in_progress
baseline: agent-platform-v1-dev-baseline-2026-08-r22
current_substage: 最小可观测实现与门禁已完成；生产 scrape 组合、持久 backlog/saturation Gauge 和完整跨进程 Trace propagation 后置
scope:
  includes:
    - 复用 PlatformMetrics 私有 CollectorRegistry，补齐 API、Worker、Event Store、SSE、Outbox、Reconciliation、Run Queue、Capacity Lease 和 Model Gateway 的低基数指标
    - 以 Histogram/Counter/Gauge 形成控制面和运行面 SLI 观测输入，不把压测结果或估算值冒充 SLO 已达标
    - SSE 在线连接、PostgreSQL 轮询回退、慢消费者发送超时和可见延迟指标；Redis 继续只作唤醒通道
    - Event 批量写入数量、延迟和失败分类指标；PostgreSQL 继续是 RunEvent 唯一事实来源
    - Run admission、Capacity Domain/Lease、Outbox、Worker 恢复和 Reconciliation 结果的容量与可靠性指标
    - trace_id 在 API、Temporal、Outbox、RunEvent、Worker 日志和受控内部调用间关联；高基数业务 ID 只进入 Trace/Log
    - 独立 Worker 的受控 Prometheus metrics 暴露与 Kubernetes 抓取边界
    - Prometheus 告警规则和最小处置 Runbook；每条告警包含 owner、severity、threshold、for、恢复条件和有效 Runbook 链接
    - 指标标签基数、敏感字段和 Secret 泄漏负向测试
  excludes:
    - AP-E7-005 的 100 AgentScope Run、1000 SSE、2000 events/s、20 Codex Run、30% 安全余量真实容量和耐久压测
    - Event 写入侧功能性有限缓冲、Delta 合并、终态优先队列和超过恢复阈值时 Run 失败语义
    - 生产告警接收渠道、排班系统、通知 Secret 和真实 receiver 路由
    - AP-E7-007 的灾备、恢复演练和最终生产准入
    - RunEvent 全局唯一登记表与 recorded_at 月分区事件表
decisions:
  - PlatformMetrics 保持每个 API/Worker/Test 私有 CollectorRegistry；禁止改用全局默认 Registry 规避重复注册
  - Metric 标签只允许固定枚举或有明确上界的 process、outcome、method、status_class、provider、mode、runtime_type 等维度
  - tenant_id、run_id、workflow_id、session_id、sandbox_id、Prompt、文件名、模型标识和用户输入不得作为长期 Metric Label
  - 高基数关联标识保留在 Trace/结构化日志和既有 durable fact，不新增公开 Trace 查询 API
  - PostgreSQL 是 Event、Outbox、Queue、Capacity Lease 和 Reconciliation 状态事实来源；Redis/Prometheus 不参与业务状态判断
  - SLO 阈值沿用非功能基线；告警阈值和持续时间可由部署覆盖，代码不硬编码生产 receiver
  - Worker metrics 开发默认为 127.0.0.1:9090/metrics，Kubernetes 只在 Service/NetworkPolicy 受控时覆盖 bind 地址
  - AP-E7-004 只交付可计算、可抓取、可告警的观测能力；真实容量结论由 AP-E7-005 报告给出
  - 当前可抓取范围以已进入 Kubernetes 受控组合的 Event/Reconciliation Worker 为准；API/Temporal/Sandbox/Runtime metrics 必须在对应生产 overlay 接入后才可作为生产告警输入
  - "`outbox_claimed` 是最近一次有界 poll 的观测，不代表持久 backlog 或 oldest age；Queue depth、Lease active/configured/saturation Gauge 在后续 PostgreSQL 聚合任务补齐"
  - durable `trace_id`、结构化日志和 API Span 属性已关联；从 Outbox durable payload 恢复完整 OTel Span Context 的跨进程 propagation 后置
compatibility:
  - 不修改公共 OpenAPI、RunEvent Schema、Temporal Workflow Definition 或 Vue 业务契约
  - 现有指标名称和标签语义保持兼容；新增指标为向后兼容扩展
  - 后端 Python 代码位于 backend，前端代码位于 frontend；本任务预期不需要新增前端业务页面
  - 本次稳定门禁后冻结 baseline r22；不修改公共 OpenAPI、RunEvent Schema、Temporal Workflow 或 Vue 业务契约
