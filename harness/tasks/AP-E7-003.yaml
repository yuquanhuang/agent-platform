task_id: AP-E7-003
title: 配额、预算、限流和背压
status: completed
baseline: agent-platform-v1-dev-baseline-2026-08-r21
current_substage: AP-E7-003 代码与契约已完成，生产组合与容量验收转后续任务
scope:
  includes:
    - Run 创建和重试的 tenant、user、Agent、Runtime 类型非终态并发硬限制
    - PostgreSQL advisory transaction lock 保证多实例下计数与创建原子化
    - 超限返回冻结 429 RATE_LIMITED，并持久化 DENIED Audit
    - staging/production API 组合显式要求全部 Run capacity 配置
    - 每租户单一 durable quota_policy、不可变 quota_policy_version 与 ACTIVE/DISABLED 管理
    - QuotaPolicy 管理 API 的 RLS、tenant_admin RBAC、ETag/CAS、幂等和 Audit
    - ACTIVE 租户策略与部署 capacity 逐维求交并接入 Run create/retry
    - 每租户单一 durable budget_policy、不可变 budget_policy_version 与 ACTIVE/DISABLED 管理
    - UTC DAILY/MONTHLY HARD Token 策略接入 Model Gateway，和 Run token_budget 取更严格余额
    - 预约固化 Policy/Version/周期快照；结算、释放、幂等和跨 Run 并发保持原子
    - 不可变 price_catalog_version/price_catalog_rate、RLS、有效时间选择和 Decimal 计价
    - Provider reported / catalog calculated 费用 provenance 固化到不可变 model_usage
    - 部署级 Artifact 租户预留字节/数量硬上限、advisory transaction lock 和上传原子准入
    - Artifact 超限复用冻结 429 RATE_LIMITED、独立 DENIED Audit 和失败幂等 claim 回滚
    - Event Worker 主动回收上传窗口已过期的 UPLOADING，并复用既有异步删除链路释放容量
    - FOR UPDATE SKIP LOCKED 并发认领、确定性删除 Outbox、Operation 和 Audit 原子持久化
    - Run create/retry 原子写 QUEUED + WAITING，准入后才写确定性 agent.run_requested.v1 Outbox
    - PostgreSQL priority/FIFO Scheduler、deadline、队列长度上限、容量快照和批内不超配
    - WAITING 取消/超时不创建 Workflow、Attempt、Sandbox 或 Run start Outbox，并写 RunEvent/Audit
    - Run queue 最大等待、每租户长度、批次和轮询周期均配置化并提供开发默认值
    - 独立低延迟 Run admission 循环，完整 Approval/Sandbox/Run 对账保持原轮询周期
    - 每租户单一 durable storage_policy、不可变 storage_policy_version 与 ACTIVE/DISABLED 管理
    - Workspace/Artifact 分离四维额度、部署上限逐维求交、事务锁原子准入和策略版本审计
    - Artifact 创建时冻结 AVAILABLE expires_at（默认 30 天），FAILED/REJECTED/EXPIRED 冻结 retention_delete_after（默认 7 天）
    - 多个活动 Legal Hold、按 case_ref 区分、阻断自动/手动删除并支持受审计解除
    - Artifact 删除失败 1 小时后恢复，最多创建 3 次删除 Operation
    - 以 Deployment runtime_target_id 为全局 Capacity Domain，按显式 slots 创建不可超配 Lease
    - 全局跨租户公平 Scheduler、租户 quantum、WAITING timeout 与 Lease 续租/释放对账
  excludes:
    - user/agent 分级周期预算、Sandbox CPU/内存/PID 配额
    - 生产供应商官方 Tokenizer/Count API 与 Golden 对账、真实价目 source 录入
    - 对象存储事实对账、生产 SOFT 告警通知渠道
    - Temporal Task Queue、Event Store、SSE 背压与 AP-E7-004 指标告警
decisions:
  - PostgreSQL 保存 WAITING；ADMITTED 后才启动 Temporal，不新增 Workflow Queue Signal/Timer，历史 Replay 保持兼容
  - 普通 WAITING 不占执行容量；仅 QUEUED+ADMITTED 或执行状态占槽，终态 ADMITTED 事实不永久计数
  - Scheduler 每个准入决定后 flush，使同批后续候选看见已占容量，避免批内超配
  - advisory lock key 按稳定字符串排序，避免多维准入锁死锁；计数和 Run 写入位于同一租户事务
  - 拒绝审计使用独立 Tenant UoW 提交，原创建/重试事务回滚，避免留下失败请求的幂等 claim
  - Runtime 限制当前按租户内 Runtime 类型（agentscope/codex）统计，集群级限制留待后续
  - 每租户最多一个 quota_policy；创建即 ACTIVE，更新生成不可变 version；DISABLED 回退部署限制
  - 部署 capacity 是硬上限，租户策略只能收紧；未配置租户维度继承部署限制
  - BudgetPolicy 支持 UTC 日历 DAILY/MONTHLY、HARD/SOFT、token_limit 和可选 USD/CNY cost_limit
  - Run 与租户周期预算同时存在时取更严格余额；无 Run 预算时 ACTIVE 租户策略仍生效
  - 调用前 cost budget 使用冻结 Route cap、Counter 版本/Hash 和 PUBLISHED PriceCatalog 计算可信上界；缺失任一事实时 COST_BOUND_UNAVAILABLE 失败关闭
  - C2a 只做调用后费用事实；Provider cost 优先，否则需完整命中调用完成时有效目录和 Token 维度
  - model_usage 固化 cost_source、price_catalog_version_id 和计算明细，目录/Usage 不完整时费用保持未知
  - C2b 以 fallback Route 最大上界（非求和）执行调用前费用准入，预留上界、append-only ledger 结算/释放并记录 submitted/unknown Provider attempt
  - C2b 仅支持 USD/CNY，不做汇率换算；请求、预算、目录或 Provider 币种不一致失败关闭
  - HARD 超限在调用前拒绝；SOFT 不阻断调用，同策略版本/周期/维度只写一次确定性 Outbox 与 Audit 阈值事实
  - PriceCatalog 已有受控内存 DRAFT/PUBLISHED/rollback 边界与重叠区间阻断；不冒充持久化生产管理入口
  - Artifact 容量按 DELETED 以外记录的声明大小和数量预留，完成物理删除后释放；避免上传、扫描、隔离和删除中的对象被低估
  - D1 仅增加部署硬上限，不扩展 QuotaPolicy/OpenAPI；租户 durable 联合存储策略和软阈值需后续冻结
  - D2 严格限定上传窗口已过期且从未完成的 UPLOADING；不自动删除 FAILED/REJECTED/EXPIRED
  - D2 按 UPLOADING -> FAILED -> DELETING 服从既有状态机，物理删除成功为 DELETED 后才释放容量
  - StoragePolicy 的 Workspace/Artifact 字节和数量额度池分离，ACTIVE 只能收紧部署值，DISABLED/不存在回退部署值
  - Workspace 按 FrozenSandboxPolicy quota_bytes 预留，既有 Run Workspace 不因策略更新漂移；Artifact 继续仅 DELETED 释放
  - 策略变更与两条准入共享 storage-policy tenant advisory transaction lock，成功/拒绝 Audit 固化版本 ID
  - AVAILABLE 可下载期限使用 Artifact 创建时固化的 expires_at；FAILED/REJECTED/EXPIRED 取证期使用进入状态时固化的 retention_delete_after
  - 任一活动 Legal Hold 均阻断自动和手动删除；解除后恢复原 retention deadline，不伪造新保留期
  - Legal Hold 与删除恢复为受审计内部管理边界，本阶段不扩展公共 OpenAPI
  - Capacity Domain 键冻结为 Deployment runtime_target_id；slots 是运维明确上限，不伪造 Worker 发现事实
  - Lease 与 QUEUE ADMITTED、Outbox、Audit 同事务；运行中过期 Lease 续租或失败关闭，不盲目释放
  - 终态/孤儿 Lease 由 Reconciliation Worker 释放；公平调度先跨租户 quantum，再保留租户内 HIGH/FIFO
