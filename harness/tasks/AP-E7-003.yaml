task_id: AP-E7-003
title: 配额、预算、限流和背压
status: in_progress
baseline: agent-platform-v1-dev-baseline-2026-08-r14
current_substage: durable QuotaPolicy 管理、版本与 Run 原子准入
scope:
  includes:
    - Run 创建和重试的 tenant、user、Agent、Runtime 类型非终态并发硬限制
    - PostgreSQL advisory transaction lock 保证多实例下计数与创建原子化
    - 超限返回冻结 429 RATE_LIMITED，并持久化 DENIED Audit
    - staging/production API 组合显式要求全部 Run capacity 配置
    - 每租户单一 durable quota_policy、不可变 quota_policy_version 与 ACTIVE/DISABLED 管理
    - QuotaPolicy 管理 API 的 RLS、tenant_admin RBAC、ETag/CAS、幂等和 Audit
    - ACTIVE 租户策略与部署 capacity 逐维求交并接入 Run create/retry
  excludes:
    - 有界排队、最大等待时间、取消和 Temporal Replay 调整
    - 周期 budget_policy 管理与持久化、Token/费用聚合和可信费用表
    - Model Token/费用预算、Sandbox/Workspace/Artifact 配额
    - Temporal Task Queue、Event Store、SSE 背压与 AP-E7-004 指标告警
decisions:
  - 当前 Workflow 在同一 Activity 内从 CREATED 到 QUEUED/PREPARING，没有真实等待队列；已完成部分采用硬拒绝 429，不伪造排队
  - advisory lock key 按稳定字符串排序，避免多维准入锁死锁；计数和 Run 写入位于同一租户事务
  - 拒绝审计使用独立 Tenant UoW 提交，原创建/重试事务回滚，避免留下失败请求的幂等 claim
  - Runtime 限制当前按租户内 Runtime 类型（agentscope/codex）统计，集群级限制留待后续
  - 每租户最多一个 quota_policy；创建即 ACTIVE，更新生成不可变 version；DISABLED 回退部署限制
  - 部署 capacity 是硬上限，租户策略只能收紧；未配置租户维度继承部署限制
compatibility:
  - OpenAPI resources 升至 1.2.0，并重新生成 17 个 Python/TypeScript 契约文件
  - 新增数据库迁移 0034_quota_policy；未新增 Python/Node 依赖
  - task 记录同步到最新 R14 baseline；后端代码位于 backend，前端代码位于 frontend
configuration:
  required_in_staging_production:
    - AP_RUN_MAX_NONTERMINAL_PER_TENANT
    - AP_RUN_MAX_NONTERMINAL_PER_USER
    - AP_RUN_MAX_NONTERMINAL_PER_AGENT
    - AP_RUN_MAX_NONTERMINAL_AGENTSCOPE
    - AP_RUN_MAX_NONTERMINAL_CODEX
  local_test_behavior: 未配置时保持既有行为
