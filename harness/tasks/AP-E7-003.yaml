acceptance:
  - 每租户最多一个 quota_policy，版本不可变，ACTIVE/DISABLED 状态和 ETag/CAS 正确
  - tenant_admin 只能管理本租户策略；RLS、幂等和 Audit 不越权、不泄漏敏感配置
  - ACTIVE 租户限制不会扩大部署 capacity；禁用后回退部署限制
  - 多实例并发申请同一容量槽位时至多一个 Run 被 ADMITTED，其他保持 WAITING
  - create/retry 在队列长度未满时成功持久化；队列长度上限返回 RATE_LIMITED/RUN_QUEUE_PENDING_LIMIT 且不留下幂等 claim
  - WAITING 取消/超时写终态 RunEvent，无 Attempt/Workflow/Sandbox/Run start Outbox；容量释放后后续项可准入
  - ADMITTED 后确定性 Outbox 和 Workflow 启动链路正常，Temporal 历史 Replay 无回归
  - BudgetPolicy 版本不可变，周期快照完整，tenant_admin 管理不越权
  - 无 Run token_budget 时 ACTIVE 租户策略仍限制模型调用；Run 与租户预算取最小余额
  - 多个 Run 并发竞争同一租户周期余额时不会超配，禁用策略后回退 Run 预算
  - PriceCatalog 版本/费率不可更新删除，按 Tenant/Provider/Model/UTC 生效时间读取且 RLS 不越权
  - 目录计算使用 Decimal 和显式 Token 维度，未知价格/费率/Usage 不按零费用归因
  - 调用前上界使用冻结 Route cap/Counter/PriceCatalog，fallback 取最大值；不可信时失败关闭
  - HARD/SOFT 和 USD/CNY cost_limit 公共契约可用，币种不一致不换汇且失败关闭
  - cost_ledger_entry 与 model_provider_attempt 不可更新删除，重试/fallback submitted 或 unknown 尝试幂等记录
  - 两个并发上传竞争最后一个租户容量槽位时至多一个成功；拒绝不留下 Artifact 或幂等 claim
  - Artifact 在 UPLOADING/SCANNING/AVAILABLE/REJECTED/FAILED/EXPIRED/DELETING 均占用预留容量，只有 DELETED 释放
  - 两个并发 sweeper 对同一过期上传合计只认领一次，重复 sweep 不重复创建 Operation/Outbox
  - 未过期 UPLOADING 和已进入 AVAILABLE 的 Artifact 不被回收；对象删除完成后同额上传可再次准入
  - 每租户最多一个 StoragePolicy，版本不可变，ETag/CAS、RLS/RBAC、幂等、Audit 和启停正确
  - ACTIVE 策略不会扩大部署值；Workspace/Artifact 分离池并发不超配，DISABLED 回退部署值
  - Workspace 使用 quota_bytes 预留，既有 Run quota 不漂移；成功/拒绝审计记录实际策略版本 ID
  - AVAILABLE expires_at 在创建时固化，取证状态 retention_delete_after 在状态进入时固化，两者均不随配置或 updated_at 漂移
  - 多个活动 Legal Hold 按 case_ref 并存，任一 Hold 阻断保留期和手动删除，解除后可继续生命周期
  - 删除失败恢复等待 1 小时且最多 3 个 Operation，重复 sweep 不超配恢复次数
  - 同 Capacity Domain 跨租户并发调度不超过 slots，Lease/ADMITTED/Outbox/Audit 原子一致
  - WAITING 取消/超时不创建 Lease；运行中过期 Lease 不可被第二个 Run 盗用，终态/孤儿释放后后续 Run 可准入
