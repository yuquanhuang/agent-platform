  - durable QuotaPolicy、capacity admission、429 API、配置和组合定向测试：本轮 16 passed
  - 真实 PostgreSQL migration/RLS 完整升降级与 Resource Registry/Run 协同：定向分别 1 passed
  - make backend-check：732 passed、18 skipped
  - make frontend-check：26 个测试文件、85 passed、生产构建通过
  - make contract-check：R14 完整性与生成代码零漂移，176 个唯一 operationId、17 个生成文件
  - make check：通过
  - AP_TEST_DATABASE_URL=postgresql+asyncpg://localhost/agent_platform_test AP_TEST_TEMPORAL=1 AP_TEST_REDIS_URL=redis://127.0.0.1:16379 AP_TEST_MINIO_ENDPOINT=http://127.0.0.1:19000 make check-all：后端 748 passed、2 skipped；前端 85 passed
acceptance:
  - 每租户最多一个 quota_policy，版本不可变，ACTIVE/DISABLED 状态和 ETag/CAS 正确
  - tenant_admin 只能管理本租户策略；RLS、幂等和 Audit 不越权、不泄漏敏感配置
  - ACTIVE 租户限制不会扩大部署 capacity；禁用后回退部署限制
  - 多实例并发申请同一容量槽位时至多一个 Run 被接受
  - create/retry 超限均返回 RATE_LIMITED，Audit 记录 reason_code/current/limit 且不泄漏敏感信息
  - 失败请求的幂等 claim 不残留，成功 Run 可正常进入后续 Workflow/Outbox 链路
