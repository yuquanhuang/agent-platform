acceptance:
  - rollbackAgent 只接受当前 tenant、指定 Agent 的历史 Snapshot，并写入独立回滚审计事实
  - 回滚产生新的 Release、Operation 和 Deployment，不修改或复活旧记录
  - 回滚失败时当前 ACTIVE Deployment 保持服务；成功时使用 fencing 原子退役旧 Deployment
  - 回滚重复请求按 Idempotency-Key 稳定重放，Temporal 重试不重复产生 Deployment
  - Vue 明确展示目标版本和 Snapshot，确认后轮询新 Release 并展示实际 Deployment
follow_up:
  - Sandbox Profile 管理入口仍需独立任务实现；历史 Snapshot 本身必须已包含可编译 Sandbox 绑定
  - 外部 CI 仍需回填 AgentScope Registry manifest digest；缺失时发布和回滚均继续失败关闭
