decisions:
  - 发布预览使用 POST 请求表达 Draft 版本和 Runtime Target 集合，但必须只读、无幂等记录和发布审计事实
  - Preview 仅供展示；正式发布继续在事务内重新编译并执行 Draft CAS
  - Diff 对 canonical JSON 做确定性比较，复杂或敏感值只返回稳定摘要
  - 多 Runtime Target 分别对比其当前 ACTIVE Deployment Snapshot；首次发布按 added 展示
compatibility:
  - 保留既有 publishAgent、getRelease、getDeployment 和 R6 DTO 语义
  - 新增契约和字段保持向后兼容，生成 DTO 仍由 OpenAPI 单一来源产生
  - 不修改 Release/Deployment 状态机，不把 Preview 结果持久化为 Snapshot
