task_id: AP-E7-007
title: Runbook、灾备和恢复演练与生产准入
status: in_progress
baseline: agent-platform-v1-dev-baseline-2026-08-r22
scope:
  includes:
    - PostgreSQL、Object Storage、Redis、Temporal 的冻结 RPO/RTO 目标和不可变恢复证据
    - PostgreSQL 备份恢复与 Snapshot/Run/RunEvent/Outbox/Lease/Audit 完整性核对
    - Redis 通知丢失后的 SSE 数据库补齐、Worker/Temporal 滚动重启和 Sandbox 节点故障恢复
    - Object Storage 暂时不可用、Model Gateway 限流/供应商故障、Outbox Dead Letter 原事件重放和状态对账
    - 季度恢复演练、RPO/RTO 记录、问题闭环和生产准入证据静态校验
    - 生产准入对契约、迁移恢复、Runtime/事件 Replay、安全、容量、供应链、可观测性、保留策略和已知风险的求交
    - backend Python 验收 CLI、infra/recovery/ap-e7-007 计划/证据模板和 Runbook；本任务不新增 frontend 业务代码
  excludes:
    - 在当前环境真实创建备份、恢复数据库、清空 Redis、停止生产 Worker 或调用生产依赖
    - 用 dry-run、Fake、估算 RPO/RTO 或局部手工调用宣称灾备/生产准入通过
    - 修改公共 OpenAPI、RunEvent Schema、Temporal Workflow Definition 或数据库迁移
decisions:
  - 冻结目标沿用非功能基线：PostgreSQL 5m/60m、Object Storage 15m/4h、Redis 只允许丢通知且 RTO 30m、Temporal RTO 60m
  - Redis 不是业务事实源；Redis 丢失只能丢通知，SSE 必须从 PostgreSQL 补历史，业务事件不得丢失
  - Outbox/DLQ 只能按原 event ID 幂等重放，不创建替代事件、不直接写终态、不 blanket replay
  - 生产证据必须使用不可变 URI+SHA-256、真实隔离环境、责任人与审批人；占位、NOT_RUN、过期证据 fail-closed
  - 季度演练窗口最大 92 天，生产 `plan.as_of` 必须在验收时钟五分钟内，避免陈旧计划绕过准入
  - 只在环境 overlay 启用已验证组件；不因恢复演练临时放宽 Secret、NetworkPolicy、Tenant 或 Sandbox 安全边界
compatibility:
  - 不修改公共 OpenAPI、RunEvent、Temporal、数据库迁移、前端生成代码或现有 Worker 业务行为
  - 复用现有 Pydantic、PyYAML 和报告基础设施，不新增 Python/Node 运行时依赖
  - 与 AP-E7-002 的 Worker/Redis/MinIO/Checkpoint 恢复边界、AP-E7-003 的配额/Lease、AP-E7-004 的告警/Runbook、AP-E7-005 的容量报告和 AP-E7-006 的供应链/Sandbox 证据协同
verification:
  planned:
    - recovery_acceptance 配置、UTC 时间、路径边界、证据 URI、RPO/RTO、场景和准入项单元测试
    - dry-run CLI JSON/Markdown 报告生成验证
    - make backend-check
    - make frontend-check
