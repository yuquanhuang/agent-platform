acceptance:
  - 相同 Snapshot、资源和 Artifact 字节生成相同文件集合、Bundle ID 和 content_hash
  - Bundle Manifest 通过冻结 Draft 2020-12 Schema，并额外校验唯一排序、Hash 和文件集合语义
  - 篡改文件、资源 Hash、模型路由、跨租户输入、递归图、危险路径或缺失 Sandbox 均失败关闭
  - Skill secret-purpose 只进入权限策略，MCP Secret Reference 只以 secret:// 引用进入 Manifest
  - Bundle 编译和验证不启用 Runtime Worker，不访问 Registry、供应商网络或 Secret 明文
follow_up:
