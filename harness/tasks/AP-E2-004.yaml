acceptance:
  - 首次激活创建 ACTIVE Deployment；再次发布原子退役旧记录并保留完整历史
  - 多目标激活全成全败，任一预校验失败时既有 ACTIVE 集合保持不变
  - 同一 Release 重试返回相同 Deployment ID，并发或过期 Release 不能产生两个 ACTIVE
  - 跨租户查询和写入由显式 tenant 条件、复合外键和 FORCE RLS 同时阻断
follow_up:
