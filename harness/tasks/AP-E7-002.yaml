acceptance:
  - 短暂依赖错误有界恢复，持续错误退出并由 Kubernetes 重启
  - Redis 通知丢失不造成 RunEvent 永久丢失，也不让已撤销下载持续超过复核窗口
  - Artifact 上传、扫描、提升、Range 下载、撤销和删除使用同一 MinIO Adapter
  - Checkpoint 只恢复同 Tenant/Run/Attempt/fencing token 的最新 AVAILABLE 密文状态
