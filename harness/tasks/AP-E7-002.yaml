task_id: AP-E7-002
title: API、Worker、Temporal、Redis、S3 故障恢复
status: in_progress
baseline: agent-platform-v1-dev-baseline-2026-08-r13
scope:
  includes:
    - API、Event Worker、Reconciliation Worker 和 Temporal Worker 的依赖恢复边界
    - Redis 通知丢失后的 PostgreSQL 事实补齐验证
    - Runtime 未知副作用的 inspect-before-recover、fencing 与 durable checkpoint
    - MinIO Artifact Adapter、Download Gateway 和对象依赖的失败收敛
    - Kubernetes 进程装配、Secret 注入、故障注入、指标和恢复记录
  excludes:
    - 缺少可信 Inspector 时猜测修复 Provider、Object Store 或 RuntimeSession 孤儿
    - blanket 重放 DEAD Outbox 或伪造 Run 终态、usage 和 RunEvent
decisions:
  - Polling Worker 只重试明确识别的数据库、Redis、Temporal 和传输层短暂错误
  - Redis 仅作唤醒通道，RunEvent 和下载撤销均由 PostgreSQL durable fact 最终确认
  - Artifact 下载使用私有 MinIO 前置的 Download Gateway，不签发下载预签名 URL
  - Download API 支持标准单 Range 200/206/416；多 Range 不进入 V1
  - Kubernetes 使用 EnvSecretBackend 注入 AP_SECRET_*，Vault Adapter 预留并失败关闭
  - runtime-worker-agentscope 在 Session/Bundle/Tool/Executor 生产组合缺失时继续失败关闭
compatibility:
  - R12 Core OpenAPI 1.6.0 增加 Range Header 和 206/416 响应，既有 ArtifactDownload 结构不变
  - 新增 0032 artifact_download_grant 和 0033 runtime_checkpoint；部署前顺序迁移
  - 新增 minio Python 依赖；前后端 Client 由冻结 OpenAPI 重新生成
