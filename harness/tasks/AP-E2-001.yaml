decisions:
  - resolve_on_publish 只选择启用 Definition 下最新 PUBLISHED Version
  - fixed 绑定也必须指向当前可发布 Definition 的 PUBLISHED Version
  - child Agent 必须已有不可变 Snapshot；未发布、跨租户和递归依赖失败关闭
  - knowledge 尚未进入 Resource Registry，Snapshot 编译不创建占位版本
  - expected_draft_resource_version 指 Agent Draft CAS；agent_version.version_no 指发布序号
compatibility:
  - Snapshot 只保存 Secret Reference 所属不可变 binding snapshot 的 ID/Hash，不保存 Secret 明文
  - Runtime 和 Gateway 后续只消费 Snapshot/Version，不回读 Agent、ModelConfig 或 Provider Draft
  - AP-E1-009 Registry manifest digest 外部回填不阻塞本阶段纯 Snapshot 开发
