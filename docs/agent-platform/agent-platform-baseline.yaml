status: frozen-development-input
frozen_at: '2026-08-14'
integrity_algorithm: sha256
integrity_excludes:
- agent-platform-baseline.yaml
change_summary:
- AP-E7-004 冻结低基数私有 Registry 指标、Event/SSE/Outbox/Reconciliation/Queue/Lease/Model Gateway 观测输入；补齐 Temporal RPC 失败、RunEvent 批次失败和 SSE 降级告警；Worker metrics 受控 Service/NetworkPolicy/PrometheusRule/Runbook 已静态校验
- AP-E7-004 明确当前 Kubernetes base 只抓取已进入受控组合的 Worker；API metrics 及未进入 base 的独立进程需在部署 overlay 接入后才可生产告警；队列深度/Lease 饱和持久 Gauge、完整跨进程 OTel context propagation、完整控制面/运行面 SLO 指标和真实 receiver 继续后置
- AP-E7-003 完成 Artifact retention/Legal Hold、Capacity Domain/Lease 与 C2b Cost Budget 代码和契约收口
- AVAILABLE 使用创建时冻结的 expires_at（默认 30 天）；FAILED/REJECTED/EXPIRED 使用状态进入时冻结的 retention_delete_after（默认 7 天）
- Capacity Domain 以 runtime_target_id 为键，显式 slots、跨租户 quantum 和 durable Lease 防止全局超配；0041 升降级回填期间对称管理 Queue 不可变 Guard
- BudgetPolicy 扩展 HARD/SOFT 与可选 USD/CNY cost_limit；调用前可信上界使用冻结 Route cap、Counter 版本/Hash、billing semantics 和 PUBLISHED PriceCatalog，fallback
  取最大 Route 上界
- append-only cost ledger 与 Provider attempt 固化预留、释放、结算、未知及 submitted/unknown 尝试；不换汇且可信事实或币种不一致时失败关闭
- 生产仍需官方 Counter Golden、Model Gateway Counter/Planner/Attempt Store 组合、durable PriceCatalog 管理入口、SOFT 通知和 Capacity 真实 PostgreSQL
  专项验收
- F1 冻结 durable StoragePolicy 管理 API：每租户单策略、ACTIVE/DISABLED、不可变版本、ETag/CAS、幂等、RLS/RBAC 和 Audit
- Workspace 与 Artifact 使用分离的四维预留额度；ACTIVE 租户策略只能收紧部署硬上限，DISABLED/不存在时回退部署配置
- Artifact 上传与 Workspace 创建在 PostgreSQL 租户事务锁内读取 ACTIVE 版本、统计 DELETED 以外预留并原子准入；成功/拒绝审计固化不可变策略版本 ID
- Workspace 继续按 FrozenSandboxPolicy 的 quota_bytes 预留，既有 Run Workspace 不因策略更新漂移；开发默认租户上限为 10 GiB/100 个 Workspace
- F1 不包含 Retention、软阈值告警或对象存储事实对账；后续顺序调整为 Artifact retention、Capacity Domain/Lease、C2b Cost Budget
- E1 冻结 PostgreSQL durable Run admission queue：create/retry 原子 WAITING，priority/FIFO、deadline 和容量求交后 ADMITTED，再写确定性 Run start
  Outbox 并启动 Temporal
- WAITING 取消/超时不创建 Workflow、Attempt、Sandbox 或 Run start Outbox；队列长度、最大等待、批次和轮询周期均配置化并提供默认值
- Reconciliation Worker 使用独立低延迟 Run admission 循环，完整 Run/Approval/Sandbox 对账保持原周期；Workflow 未新增 Queue Signal/Timer，Temporal
  Replay 契约不变
- AP-E7-003 实施顺序为 durable StoragePolicy、Artifact retention、Capacity Domain/Lease、C2b Cost Budget；C2b 仅支持 USD/CNY、不换汇、币种不一致失败关闭
- D2 冻结过期 UPLOADING 主动回收：FOR UPDATE SKIP LOCKED 并发认领，FAILED/DELETING、Operation、Audit 和既有删除 Outbox 原子持久化，DELETED 后释放容量
- D2 未扩展公共 API/事件或依赖；FAILED/REJECTED/EXPIRED 自动删除保留期、联合 durable Policy 和对象存储事实对账继续保留
- D1 冻结部署级 Artifact 租户预留字节/数量硬上限、PostgreSQL 原子准入、RATE_LIMITED 和拒绝审计；联合 durable 存储 Policy 留后续
- 启用 Artifact 对象存储的 staging/production 必须显式配置两项容量阈值；local/test 未配置保持兼容
- 修复后端启动常量 R10、Kubernetes ConfigMap R13 与冻结文档 R16 的历史漂移，运行时和部署输入统一升级至 R17
- C2a 冻结不可变 PriceCatalog Version/Rate、RLS、UTC 生效时间选择、Decimal 调用后费用归因及 model_usage provenance；C2b 在其上扩展可信调用前上界、台账和 SOFT 阈值事实
- 冻结 durable BudgetPolicy 管理 API、不可变版本、RLS/RBAC/Audit，以及 UTC 日/月 HARD/SOFT Token/Cost 周期准入
- Model Gateway 对 Run token_budget 与 ACTIVE 租户周期余额原子求交并固化 Policy/Version/周期快照；DISABLED 回退 Run 预算
- C2b Cost Budget、费用聚合和 SOFT 阈值事实已完成；生产通知渠道、官方 Counter Golden、durable PriceCatalog 管理与组合仍留后续
- 冻结 durable QuotaPolicy 管理 API、不可变版本、RLS/RBAC/Audit，并将 ACTIVE 租户策略接入 Run 创建/重试原子准入
- 部署 Run capacity 配置保持平台硬上限，租户策略只能收紧；禁用策略回退部署限制，周期 BudgetPolicy 留后续子阶段
- Reconciliation Worker 冻结 Kubernetes ServiceAccount + Ed25519 短期 Service Token，tenant 只来自验签 Claim，并激活受信 HTTP Sandbox Cleanup
  组合
- Download Gateway 冻结单 Range 200/206/416，长连接以 Redis 唤醒和 PostgreSQL 周期事实复核收敛撤销
- Kubernetes 采用 EnvSecretBackend 注入 AP_SECRET_*，Vault 保留失败关闭 Adapter 边界；生产对象存储采用 MinIO
- AgentScope checkpoint 使用 PostgreSQL 不可变元数据、MinIO AES-256-GCM 密文并固化 Approval runtime_checkpoint_ref
