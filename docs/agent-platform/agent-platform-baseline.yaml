rules:
  - 任何冲突必须先修正文档和基线清单，禁止 AI 自行选择。
  - 未列入本清单的草稿、示例和外部项目代码不得作为生产契约。
  - 公共契约变更必须同步更新 Schema、Golden File、追踪矩阵和兼容性说明。
  - 所有 Run 和发布从首次生产实现开始使用 Temporal，不允许建立旁路任务系统。
  - Runtime 只消费已发布 Snapshot 和不可变 Bundle。
  - RuntimeAdapter 输出 RuntimeEventCandidate，RunEvent 由 Event Service 生成。
  - V1 前端固定使用 Vue 3、TypeScript、Vite、Vue Router 4、Pinia 和 @tanstack/vue-query。
  - V1 前端 UI 组件库固定使用 Element Plus。
  - local/test 身份使用服务端 Mock OIDC；staging/production 禁止 Mock。
  - Model Gateway 必须支持 OpenAI、Qwen 和 DeepSeek Provider Adapter。
  - AgentScope 版本范围固定为 2.0.x，精确 patch 由锁文件和镜像 Digest 固定。
  - AI Coding 任务使用 AP-E<epic>-NNN 编号；Epic 是里程碑，不作为单次任务粒度。
  - 首个开发任务固定为 AP-E0-001 契约完整性与校验门禁。
  - 每个 AI Coding 任务必须校验本清单 integrity 中的 SHA-256，不一致时立即停止。
  - 本基线冻结期间不新增平行需求或契约文件；新能力修改现有权威文件并重新冻结。

