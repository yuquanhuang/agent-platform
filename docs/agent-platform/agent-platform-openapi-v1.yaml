openapi: 3.1.0
info:
  title: Agent Platform Core API
  version: 1.2.0
  description: Core development contract for Agent, Release, Session, Run, Event, Approval and Artifact.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Agents
  - name: Releases
  - name: Sessions
  - name: Runs
  - name: Approvals
  - name: Artifacts
  - name: InternalEvents
  - name: Operations
paths:
  /api/v1/me:
    get:
      tags: [Auth]
      operationId: getCurrentIdentity
      responses:
        '200':
          description: Current authenticated platform identity and active tenant context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentIdentity'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/agents:
    post:
      tags: [Agents]
      operationId: createAgent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreateRequest'
      responses:
        '201':
          description: Agent created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        default:
          $ref: '#/components/responses/ErrorResponse'
    get:
      tags: [Agents]
      operationId: listAgents
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            type: string
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Agent page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPage'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/agents/{agent_id}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Agents]
      operationId: getAgent
      responses:
        '200':
          description: Agent detail.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [Agents]
      operationId: updateAgent
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentUpdateRequest'
      responses:
        '200':
          description: Agent updated.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Agents]
      operationId: deleteAgent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '202':
          description: Agent deletion workflow accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/agents/{agent_id}/copy:
    parameters:
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Agents]
      operationId: copyAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyAgentRequest'
      responses:
        '201':
          description: Copied Agent draft.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/agents/{agent_id}/disable:
    parameters:
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
    post:
      tags: [Agents]
      operationId: disableAgent
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableAgentRequest'
      responses:
        '200':
          description: Effective Agent state.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/agents/{agent_id}/publish:
    parameters:
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Releases]
      operationId: publishAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishAgentRequest'
      responses:
        '202':
          description: Release workflow accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseAccepted'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/releases/{release_id}:
    parameters:
      - $ref: '#/components/parameters/ReleaseId'
    get:
      tags: [Releases]
      operationId: getRelease
      responses:
        '200':
          description: Release detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/agents/{agent_id}/rollback:
    parameters:
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Releases]
      operationId: rollbackAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackAgentRequest'
      responses:
        '202':
          description: Rollback release accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseAccepted'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/agents/{agent_id}/versions:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Releases]
      operationId: listAgentVersions
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Agent version page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVersionPage'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/agents/{agent_id}/versions/{version_id}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [Releases]
      operationId: getAgentVersion
      responses:
        '200':
          description: Immutable Agent version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVersion'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/agents/{agent_id}/diff:
    parameters:
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/FromSnapshotId'
      - $ref: '#/components/parameters/ToSnapshotId'
    get:
      tags: [Releases]
      operationId: diffAgentSnapshots
      responses:
        '200':
          description: Structured Snapshot diff used by publish and rollback review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotDiff'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/agents/{agent_id}/references:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Agents]
      operationId: listAgentReferences
      responses:
        '200':
          description: References that affect disable or deletion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferencePage'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/deployments/{deployment_id}:
    parameters:
      - $ref: '#/components/parameters/DeploymentId'
    get:
      tags: [Releases]
      operationId: getDeployment
      responses:
        '200':
          description: Deployment detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/sessions:
    get:
      tags: [Sessions]
      operationId: listSessions
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: agent_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, ARCHIVED, DELETED]
      responses:
        '200':
          description: Session page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Sessions]
      operationId: createSession
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
      responses:
        '201':
          description: Session created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Sessions]
      operationId: getSession
      responses:
        '200':
          description: Session detail.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [Sessions]
      operationId: updateSession
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionUpdateRequest'
      responses:
        '200':
          description: Updated Session.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Sessions]
      operationId: deleteSession
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '202':
          description: Auditable Session deletion accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/sessions/{session_id}/archive:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
    post:
      tags: [Sessions]
      operationId: archiveSession
      responses:
        '200':
          description: Archived Session.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/sessions/{session_id}/messages:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Sessions]
      operationId: listSessionMessages
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: branch_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Immutable message history page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/sessions/{session_id}/runs:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Runs]
      operationId: listSessionRuns
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Runs belonging to a Session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPage'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/runs:
    post:
      tags: [Runs]
      operationId: createRun
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreateRequest'
      responses:
        '202':
          description: Run accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAccepted'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: getRun
      responses:
        '200':
          description: Run detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/runs/{run_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Runs]
      operationId: cancelRun
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRunRequest'
      responses:
        '202':
          description: Cancellation accepted or current terminal state returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/runs/{run_id}/retry:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Runs]
      operationId: retryRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryRunRequest'
      responses:
        '202':
          description: New retry Run accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAccepted'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/runs/{run_id}/events:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - name: after
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - $ref: '#/components/parameters/Limit'
    get:
      tags: [Runs]
      operationId: listRunEvents
      responses:
        '200':
          description: Run event page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEventPage'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/runs/{run_id}/stream:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/LastEventId'
      - name: after
        in: query
        schema:
          type: integer
          minimum: 0
    get:
      tags: [Runs]
      operationId: streamRunEvents
      responses:
        '200':
          description: SSE stream. Each event data field contains a RunEvent JSON object.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/approvals/{approval_id}/decision:
    parameters:
      - $ref: '#/components/parameters/ApprovalId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
    post:
      tags: [Approvals]
      operationId: decideApproval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
      responses:
        '200':
          description: Effective approval state.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/approvals:
    get:
      tags: [Approvals]
      operationId: listApprovals
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, EXPIRED, CANCELLED, CONSUMED]
        - name: run_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Approval page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalPage'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/approvals/{approval_id}:
    parameters:
      - $ref: '#/components/parameters/ApprovalId'
    get:
      tags: [Approvals]
      operationId: getApproval
      responses:
        '200':
          description: Approval detail.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/artifacts/uploads:
    post:
      tags: [Artifacts]
      operationId: createArtifactUpload
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactUploadCreateRequest'
      responses:
        '201':
          description: Restricted upload created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactUploadAccepted'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/artifacts/{artifact_id}:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
    get:
      tags: [Artifacts]
      operationId: getArtifact
      responses:
        '200':
          description: Artifact metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Artifacts]
      operationId: deleteArtifact
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Artifact deletion accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/artifacts/{artifact_id}/complete:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Artifacts]
      operationId: completeArtifactUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactCompleteRequest'
      responses:
        '202':
          description: Artifact verification and scan accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/artifacts/{artifact_id}/download:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
    get:
      tags: [Artifacts]
      operationId: createArtifactDownload
      responses:
        '200':
          description: Short-lived authorized download URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactDownload'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/operations/{operation_id}:
    parameters:
      - $ref: '#/components/parameters/OperationId'
    get:
      tags: [Operations]
      operationId: getOperation
      responses:
        '200':
          description: Queryable asynchronous operation state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /internal/v1/runs/{run_id}/events:batch:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [InternalEvents]
      operationId: appendRunEventCandidates
      security:
        - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunEventBatchRequest'
      responses:
        '200':
          description: Per-candidate append result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEventBatchResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceAuth:
      type: mutualTLS
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"rv:[1-9][0-9]*"$'
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    AgentId:
      name: agent_id
      in: path
      required: true
      schema:
        type: string
    VersionId:
      name: version_id
      in: path
      required: true
      schema:
        type: string
    FromSnapshotId:
      name: from_snapshot_id
      in: query
      required: true
      schema:
        type: string
    ToSnapshotId:
      name: to_snapshot_id
      in: query
      required: true
      schema:
        type: string
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    ReleaseId:
      name: release_id
      in: path
      required: true
      schema:
        type: string
    DeploymentId:
      name: deployment_id
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema:
        type: string
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema:
        type: string
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        type: string
  headers:
    ETag:
      description: Strong resource version ETag. Its exact value is `"rv:<resource_version>"`.
      schema:
        type: string
        pattern: '^"rv:[1-9][0-9]*"$'
  responses:
    ErrorResponse:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    CurrentIdentity:
      type: object
      additionalProperties: false
      required: [user_id, external_subject, display_name, active_tenant_id, memberships, auth_time]
      properties:
        user_id:
          type: string
        external_subject:
          type: string
        display_name:
          type: string
        active_tenant_id:
          type: [string, 'null']
        memberships:
          type: array
          items:
