openapi: 3.1.0
info:
  title: Agent Platform Resource and Administration API
  version: 1.1.0
  description: Machine-readable contract for versioned resources, administration, Knowledge, Evaluation, Schedule, A2A Client and Audit APIs.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Prompts
  - name: Skills
  - name: McpServers
  - name: ModelProviders
  - name: ModelConfigs
  - name: RuntimeTargets
  - name: SandboxProfiles
  - name: Tenants
  - name: Members
  - name: Roles
  - name: Knowledge
  - name: Evaluations
  - name: Schedules
  - name: RemoteAgents
  - name: Audit
  - name: Operations
paths:
  /api/v1/prompts:
