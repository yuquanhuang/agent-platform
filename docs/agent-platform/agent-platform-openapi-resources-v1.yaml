    ResourceRollbackRequest:
      type: object
      additionalProperties: false
      required: [version_id, expected_resource_version, release_note]
      properties:
        version_id: { type: string }
        expected_resource_version: { type: integer, minimum: 1 }
        release_note: { type: string, minLength: 1, maxLength: 2000 }
    ResourceCopyRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9_-]{2,63}$' }
