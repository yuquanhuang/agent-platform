      tags: [Prompts]
      operationId: listPrompts
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Keyword' }]
      responses: { '200': { $ref: '#/components/responses/ResourcePageResponse' }, default: { $ref: '#/components/responses/ErrorResponse' } }
