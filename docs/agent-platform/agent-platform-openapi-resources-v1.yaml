    parameters: [{ $ref: '#/components/parameters/BindingId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
    post:
      tags: [RemoteAgents]
      operationId: invokeRemoteAgent
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RemoteAgentInvokeRequest' } } }
      responses: { '202': { $ref: '#/components/responses/OperationAcceptedResponse' }, default: { $ref: '#/components/responses/ErrorResponse' } }
  /api/v1/audit-logs:
    get:
      tags: [Audit]
      operationId: listAuditLogs
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: action
          in: query
          schema: { type: string, maxLength: 128 }
        - name: resource_type
          in: query
          schema: { type: string, maxLength: 64 }
        - name: actor_id
          in: query
          schema: { type: string }
        - name: run_id
          in: query
          schema: { type: string }
        - name: occurred_from
          in: query
          schema: { type: string, format: date-time }
        - name: occurred_to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Audit page.
          content: { application/json: { schema: { $ref: '#/components/schemas/AuditPage' } } }
        default: { $ref: '#/components/responses/ErrorResponse' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"rv:[1-9][0-9]*"$' } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Keyword: { name: keyword, in: query, schema: { type: string, maxLength: 100 } }
    ResourceId: { name: resource_id, in: path, required: true, schema: { type: string } }
    TenantId: { name: tenant_id, in: path, required: true, schema: { type: string } }
    MemberId: { name: member_id, in: path, required: true, schema: { type: string } }
    RoleId: { name: role_id, in: path, required: true, schema: { type: string } }
    KnowledgeBaseId: { name: knowledge_base_id, in: path, required: true, schema: { type: string } }
    DocumentId: { name: document_id, in: path, required: true, schema: { type: string } }
    EvaluationSetId: { name: evaluation_set_id, in: path, required: true, schema: { type: string } }
    EvaluationRunId: { name: evaluation_run_id, in: path, required: true, schema: { type: string } }
    RunId: { name: run_id, in: path, required: true, schema: { type: string } }
    ScheduleId: { name: schedule_id, in: path, required: true, schema: { type: string } }
    BindingId: { name: binding_id, in: path, required: true, schema: { type: string } }
