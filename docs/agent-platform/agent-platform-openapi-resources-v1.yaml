      content: { application/json: { schema: { $ref: '#/components/schemas/OperationAccepted' } } }
  headers:
    ETag:
      description: Strong resource version ETag. Its exact value is `"rv:<resource_version>"`.
      schema: { type: string, pattern: '^"rv:[1-9][0-9]*"$' }
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties: { error: { $ref: '#/components/schemas/Error' } }
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code: { type: string, maxLength: 64 }
        message: { type: string, maxLength: 4000 }
        request_id: { type: string }
        retryable: { type: boolean }
        details: { type: object, maxProperties: 20, additionalProperties: true }
    ResourceCreateRequest:
      type: object
      additionalProperties: false
      description: content.resource_type must match the resource collection in the request path.
      required: [code, name, content_schema_version, content]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9_-]{2,63}$' }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        visibility: { enum: [private, tenant], default: private }
        content_schema_version: { type: string, maxLength: 16 }
        content: { $ref: './schemas/resource-content-v1.schema.json' }
    ResourceUpdateRequest:
      type: object
      additionalProperties: false
      description: When content is supplied, content.resource_type must match the existing resource type.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        visibility: { enum: [private, tenant] }
        content_schema_version: { type: string, maxLength: 16 }
        content: { $ref: './schemas/resource-content-v1.schema.json' }
