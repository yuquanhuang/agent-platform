      properties:
        id: { type: string }
        resource_type: { enum: [prompt, skill, mcp, model_provider, model_config, runtime_target, sandbox_profile] }
        code: { type: string, pattern: '^[a-z][a-z0-9_-]{2,63}$' }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 2000 }
        visibility: { enum: [private, tenant] }
