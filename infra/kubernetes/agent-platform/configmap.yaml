apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-platform-event-worker
  namespace: agent-platform
data:
  AP_ENV: production
  AP_SERVICE_NAME: event-worker
  AP_WORKER_METRICS_HOST: 0.0.0.0
  AP_WORKER_METRICS_PORT: "9090"
  AP_AUTH_MODE: oidc
  AP_OIDC_ISSUER: https://issuer.example.invalid
  AP_OIDC_CLIENT_ID: agent-platform
  AP_OIDC_CLIENT_SECRET_REF: secret://env/AP_SECRET_OIDC_CLIENT_SECRET
  AP_SECRET_BACKEND: env
  AP_CONTRACT_BASELINE_ID: agent-platform-v1-dev-baseline-2026-08-r22
  AP_DATABASE_DSN_REF: secret://env/AP_SECRET_DATABASE_DSN
  AP_REDIS_DSN_REF: secret://env/AP_SECRET_REDIS_DSN
  AP_OBJECT_STORAGE_ENDPOINT: https://minio.agent-platform.svc.cluster.local:9000
  AP_OBJECT_STORAGE_BUCKET: agent-platform
  AP_OBJECT_STORAGE_CREDENTIAL_REF: secret://env/AP_SECRET_OBJECT_STORAGE_CREDENTIALS
  AP_OBJECT_STORAGE_CONNECT_TIMEOUT_SECONDS: "5"
  AP_OBJECT_STORAGE_READ_TIMEOUT_SECONDS: "30"
  AP_OBJECT_STORAGE_DOWNLOAD_CHUNK_BYTES: "1048576"
  AP_OBJECT_STORAGE_MAX_CONCURRENT_DOWNLOADS: "32"
  AP_OBJECT_STORAGE_DOWNLOAD_ACQUIRE_TIMEOUT_SECONDS: "1"
  AP_TEMPORAL_ADDRESS: temporal-frontend.agent-platform.svc.cluster.local:7233
  AP_TEMPORAL_NAMESPACE: agent-platform-production
  AP_WORKER_TENANT_LIMIT: "100"
  AP_EVENT_WORKER_POLL_INTERVAL_SECONDS: "1"
  AP_OUTBOX_BATCH_SIZE: "50"
  AP_OUTBOX_MAX_ATTEMPTS: "10"
  AP_RUN_MAX_NONTERMINAL_PER_TENANT: "100"
  AP_RUN_MAX_NONTERMINAL_PER_USER: "10"
  AP_RUN_MAX_NONTERMINAL_PER_AGENT: "50"
  AP_RUN_MAX_NONTERMINAL_AGENTSCOPE: "100"
  AP_RUN_MAX_NONTERMINAL_CODEX: "20"
  AP_RUN_QUEUE_MAX_WAIT_SECONDS: "300"
  AP_RUN_QUEUE_MAX_PENDING_PER_TENANT: "1000"
  AP_RUN_QUEUE_ADMISSION_BATCH_SIZE: "50"
  AP_RUN_QUEUE_POLL_INTERVAL_SECONDS: "1"
  AP_ARTIFACT_RETENTION_SECONDS: "2592000"
  AP_ARTIFACT_FORENSIC_RETENTION_SECONDS: "604800"
  AP_ARTIFACT_DELETE_RECOVERY_DELAY_SECONDS: "3600"
  AP_ARTIFACT_DELETE_RECOVERY_MAX_OPERATIONS: "3"
  AP_LOG_LEVEL: INFO
---
apiVersion: v1
