apiVersion: v1
kind: Secret
metadata:
  name: agent-platform-runtime-secrets
  namespace: agent-platform
type: Opaque
stringData:
  # Replace through the deployment Secret manager. Never commit real values.
  AP_SECRET_DATABASE_DSN: postgresql+asyncpg://agent-platform:replace@postgres:5432/agent_platform
  AP_SECRET_REDIS_DSN: redis://:replace@redis:6379/0
  AP_SECRET_OBJECT_STORAGE_CREDENTIALS: '{"access_key":"replace","secret_key":"replace"}'
  # Generate 32 random bytes and encode with base64url, without plaintext reuse.
  AP_SECRET_RUNTIME_CHECKPOINT_KEY: replace-with-32-byte-base64url-key
  # Keep the Ed25519 private key readable only by the Reconciliation Worker.
  AP_SECRET_INTERNAL_SERVICE_TOKEN_SIGNING_KEY: |-
    -----BEGIN PRIVATE KEY-----
    replace-through-secret-manager
    -----END PRIVATE KEY-----
  # Sandbox Manager receives only this public key.
  AP_SECRET_INTERNAL_SERVICE_TOKEN_VERIFICATION_KEY: |-
    -----BEGIN PUBLIC KEY-----
    replace-through-secret-manager
    -----END PUBLIC KEY-----
  AP_SECRET_EXECUTION_TICKET_KEY: replace-with-at-least-32-random-bytes
