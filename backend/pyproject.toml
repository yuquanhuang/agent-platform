[project]
name = "backend"
version = "0.1.0"
description = "Agent Platform backend applications and shared packages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "prometheus-client>=0.26.0",
    "pydantic>=2",
    "pydantic-settings>=2",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2",
    "temporalio>=1.31.0",
    "uvicorn>=0.52.1",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pyright]
include = ["."]
exclude = [".venv", ".pytest_cache", ".ruff_cache"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = ".."
venv = ".venv"
